options {
    directory "/var/cache/bind";
    recursion no;
    allow-query { any; };
    listen-on { any; };
    listen-on-v6 { none; };
    dnssec-validation no;
    send-cookie no;
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
};

zone "attacker32.com" {
    type master;
    file "/etc/bind/zone_attacker32.com";
};

zone "example.com" {
    type master;
    file "/etc/bind/zone_example.com";
};
